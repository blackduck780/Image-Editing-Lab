<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VS Code Style Playground – Dark Theme</title>
  
  <!-- Monaco Editor from CDN -->
  <link rel="stylesheet" data-name="vs/dark" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.css" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  
  <style>
    :root {
      --bg: #1e1e1e;
      --editor-bg: #1e1e1e;
      --tab-bg: #252526;
      --tab-active: #007acc;
      --text: #d4d4d4;
      --border: #444;
    }
    
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    header {
      background: #007acc;
      color: white;
      padding: 8px 16px;
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #005a9e;
    }
    
    .tabs {
      background: var(--tab-bg);
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    
    .tab {
      padding: 10px 20px;
      cursor: pointer;
      background: var(--tab-bg);
      border: none;
      color: var(--text);
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
    }
    
    .tab.active {
      background: var(--editor-bg);
      border-bottom: 3px solid var(--tab-active);
      color: white;
    }
    
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .editor-area {
      width: 50%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    
    .editor-container {
      flex: 1;
      position: relative;
    }
    
    #preview {
      width: 50%;
      background: white;
      border: none;
      resize: none;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
    
    @media (max-width: 900px) {
      .main { flex-direction: column; }
      .editor-area, #preview { width: 100%; height: 50%; }
      .editor-area { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>VS Code Style Playground – Dark & Attractive</header>

<div class="tabs">
  <button class="tab active" data-lang="html">HTML</button>
  <button class="tab" data-lang="css">CSS</button>
  <button class="tab" data-lang="javascript">JavaScript</button>
</div>

<div class="main">
  <div class="editor-area">
    <div id="html-editor" class="editor-container"></div>
    <div id="css-editor"  class="editor-container" style="display:none;"></div>
    <div id="js-editor"   class="editor-container" style="display:none;"></div>
  </div>
  
  <div id="preview">
    <iframe id="preview-frame" sandbox="allow-scripts"></iframe>
  </div>
</div>

<script>
// Configure Monaco to load from CDN
require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs' } });

require(['vs/editor/editor.main'], function () {
  // Create editors
  const htmlEditor = monaco.editor.create(document.getElementById('html-editor'), {
    value: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Page</title>
</head>
<body>
  <h1>Hello World 🌙</h1>
  <p>Edit me and see magic on the right →</p>
  <button onclick="sayHi()">Click me</button>
</body>
</html>`.trim(),
    language: 'html',
    theme: 'vs-dark',
    automaticLayout: true,
    fontSize: 15,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
  });

  const cssEditor = monaco.editor.create(document.getElementById('css-editor'), {
    value: `body {
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  text-align: center;
  padding: 50px;
}

h1 {
  font-size: 3.5rem;
  margin-bottom: 1rem;
  text-shadow: 0 2px 10px rgba(0,0,0,0.4);
}

button {
  padding: 12px 28px;
  font-size: 1.2rem;
  background: #ff6b6b;
  border: none;
  border-radius: 50px;
  color: white;
  cursor: pointer;
  transition: all 0.3s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(255,107,107,0.4);
}`.trim(),
    language: 'css',
    theme: 'vs-dark',
    automaticLayout: true,
    fontSize: 15,
    minimap: { enabled: false },
  });

  const jsEditor = monaco.editor.create(document.getElementById('js-editor'), {
    value: `function sayHi() {
  alert("Hello from your dark & beautiful playground! 🚀");
}`,
    language: 'javascript',
    theme: 'vs-dark',
    automaticLayout: true,
    fontSize: 15,
    minimap: { enabled: false },
  });

  // Tab switching
  const tabs = document.querySelectorAll('.tab');
  const editors = {
    html: { editor: htmlEditor, container: document.getElementById('html-editor') },
    css:  { editor: cssEditor,  container: document.getElementById('css-editor')  },
    javascript: { editor: jsEditor, container: document.getElementById('js-editor') }
  };

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      
      Object.values(editors).forEach(e => e.container.style.display = 'none');
      editors[tab.dataset.lang].container.style.display = 'block';
    });
  });

  // Live preview update
  const previewFrame = document.getElementById('preview-frame');
  const updatePreview = () => {
    const html = htmlEditor.getValue();
    const css  = `<style>${cssEditor.getValue()}</style>`;
    const js   = `<script>${jsEditor.getValue()}<\/script>`;
    
    const fullDoc = html.replace('</head>', css + '</head>').replace('</body>', js + '</body>');
    
    previewFrame.srcdoc = fullDoc;
  };

  // Update on every change (with small debounce for performance)
  let timeout;
  [htmlEditor, cssEditor, jsEditor].forEach(ed => {
    ed.onDidChangeModelContent(() => {
      clearTimeout(timeout);
      timeout = setTimeout(updatePreview, 300);
    });
  });

  // Initial render
  updatePreview();
});
</script>

</body>
    </html>
