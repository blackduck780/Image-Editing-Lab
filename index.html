<!DOCTYPE html>
<html>
<head>
<title>🔒 LAB STUDIO v6.0 - Erase + Stickers</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {
    font-family:'Courier New',monospace;
    background:#0a0a0a;color:#fff;padding:15px;line-height:1.4;
}
.container {
    max-width:1100px;margin:0 auto;background:rgba(15,15,35,0.95);
    border-radius:15px;padding:25px;border:1px solid #00ff88;
}
.logo {
    font-size:2em;background:linear-gradient(45deg,#00ff88,#ff00ff);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    text-align:center;margin-bottom:15px;
}
.upload-zone {
    border:2px dashed #00ff88;border-radius:12px;padding:25px;
    text-align:center;cursor:pointer;transition:all 0.2s;
    margin:20px 0;background:rgba(0,255,136,0.05);
}
.upload-zone:hover,.upload-zone.dragover {
    background:rgba(0,255,136,0.15);border-color:#00ff88;
}
#fileInput {display:none;}
.upload-btn {
    background:linear-gradient(135deg,#00ff88,#00d4ff);color:#000;
    border:none;padding:12px 25px;border-radius:25px;font-weight:700;
    cursor:pointer;font-size:1em;
}
.tools-bar {
    display:flex;flex-wrap:wrap;gap:10px;margin:20px 0;
    background:rgba(255,255,255,0.05);padding:15px;border-radius:10px;
}
.tool-btn {
    background:#333;padding:8px 15px;border:none;border-radius:20px;
    color:#fff;cursor:pointer;font-size:0.9em;transition:all 0.2s;
}
.tool-btn.active {background:linear-gradient(135deg,#00ff88,#ff00ff);}
.tool-btn:hover {background:#00ff88;transform:translateY(-1px);}
.controls {
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;margin:20px 0;
}
.control {
    background:rgba(255,255,255,0.05);padding:12px;border-radius:8px;
}
.control label {display:block;margin-bottom:5px;color:#94a3b8;font-size:0.9em;}
.control input,.control select {
    width:100%;background:rgba(0,0,0,0.5);border:1px solid #00ff88;
    border-radius:5px;padding:8px;color:#fff;font-family:inherit;
}
#editorCanvas {
    border:2px solid #00ff88;border-radius:10px;max-width:100%;
    cursor:crosshair;background:#000;display:none;
}
.preview {
    display:grid;grid-template-columns:1fr;gap:15px;margin-top:20px;
}
.stickers {
    display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0;
}
.sticker {
    width:45px;height:45px;border-radius:8px;background:#333;
    border:2px solid #666;cursor:pointer;font-size:1.5em;display:flex;
    align-items:center;justify-content:center;transition:all 0.2s;
}
.sticker:hover {border-color:#00ff88;transform:scale(1.1);}
#status {
    padding:12px;border-radius:8px;text-align:center;
    border:1px solid #00ff88;background:rgba(0,255,136,0.1);
    margin:15px 0;
}
.download-btn {
    background:linear-gradient(135deg,#ff00ff,#00ff88);color:#000;
    border:none;padding:15px 30px;border-radius:25px;font-weight:700;
    cursor:pointer;font-size:1.1em;display:block;margin:15px auto;
}
@media (min-width:900px) {.preview{grid-template-columns:1fr 1fr;}}
@media (max-width:768px) {.tools-bar{flex-direction:column;}}
</style>
</head>
<body>
<div class="container">
    <div class="logo">🔒 LAB STUDIO v6.0</div>
    <div style="text-align:center;color:#94a3b8;margin-bottom:20px;">
        AI Editor • Erase • Stickers • DOS Proof
    </div>
    
    <div class="upload-zone" id="uploadZone">
        <div style="font-size:2.5em;margin-bottom:10px;">🖼️</div>
        <div style="font-size:1.1em;margin-bottom:15px;">Drag & drop image</div>
        <label for="fileInput" class="upload-btn">UPLOAD IMAGE</label>
        <input type="file" id="fileInput" accept="image/*">
    </div>
    
    <div class="tools-bar" id="toolsBar">
        <button class="tool-btn" data-tool="select">Select</button>
        <button class="tool-btn" data-tool="erase">🧽 Erase</button>
        <button class="tool-btn" data-tool="brush">✏️ Brush</button>
        <button class="tool-btn" data-tool="sticker">🎨 Stickers</button>
    </div>
    
    <div class="controls">
        <div class="control">
            <label>Width</label><input type="number" id="width" value="800">
        </div>
        <div class="control">
            <label>Height</label><input type="number" id="height" value="600">
        </div>
        <div class="control">
            <label>Filter</label>
            <select id="filter">
                <option value="none">None</option>
                <option value="enhance">Enhance</option>
                <option value="vintage">Vintage</option>
            </select>
        </div>
        <div class="control">
            <label>Brightness</label>
            <input type="range" id="brightness" min="0" max="200" value="100">
        </div>
    </div>
    
    <canvas id="editorCanvas" width="800" height="600"></canvas>
    
    <div class="stickers" id="stickers" style="display:none;">
        <div class="sticker" data-sticker="⭐">⭐</div>
        <div class="sticker" data-sticker="❤️">❤️</div>
        <div class="sticker" data-sticker="🔥">🔥</div>
        <div class="sticker" data-sticker="⚡">⚡</div>
        <div class="sticker" data-sticker="🎉">🎉</div>
        <div class="sticker" data-sticker="👻">👻</div>
    </div>
    
    <div id="status">Ready - Drag image to start</div>
    <button class="download-btn" onclick="downloadResult()" id="downloadBtn" style="display:none;">
        💾 DOWNLOAD RESULT
    </button>
</div>

<script>
let canvas, ctx, originalImg, currentTool='select', isDrawing=false;
let stickers=[], eraseSize=20, brushSize=10;

document.addEventListener('DOMContentLoaded', init);

function init() {
    canvas=document.getElementById('editorCanvas');
    ctx=canvas.getContext('2d');
    
    // Drag & drop
    const zone=document.getElementById('uploadZone');
    const input=document.getElementById('fileInput');
    
    ['dragenter','dragover'].forEach(e=>zone.addEventListener(e,()=>zone.classList.add('dragover')));
    ['dragleave','drop'].forEach(e=>zone.addEventListener(e,()=>zone.classList.remove('dragover')));
    zone.addEventListener('drop',e=>{
        e.preventDefault();
        if(e.dataTransfer.files[0]) input.files=e.dataTransfer.files;
    });
    
    input.addEventListener('change',e=>loadImage(e.target.files[0]));
    
    // Tools
    document.querySelectorAll('.tool-btn').forEach(btn=>{
        btn.addEventListener('click',()=>selectTool(btn.dataset.tool));
    });
    
    // Stickers
    document.querySelectorAll('.sticker').forEach(sticker=>{
        sticker.addEventListener('click',()=>addSticker(sticker.dataset.sticker));
    });
    
    // Canvas events
    canvas.addEventListener('mousedown',startDraw);
    canvas.addEventListener('mousemove',draw);
    canvas.addEventListener('mouseup',stopDraw);
    canvas.addEventListener('mouseout',stopDraw);
}

function selectTool(tool) {
    currentTool=tool;
    document.querySelectorAll('.tool-btn').forEach(btn=>btn.classList.remove('active'));
    event.target.classList.add('active');
    
    document.getElementById('stickers').style.display=tool==='sticker'?'grid':'none';
    setStatus(`Tool: ${tool}`);
}

function loadImage(file) {
    if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>{
        originalImg=new Image();
        originalImg.onload=()=>{
            canvas.width=canvas.clientWidth;
            canvas.height=canvas.clientHeight;
            ctx.drawImage(originalImg,0,0,canvas.width,canvas.height);
            canvas.style.display='block';
            document.getElementById('downloadBtn').style.display='block';
            setStatus('Image loaded - start editing!');
        };
        originalImg.src=e.target.result;
    };
    reader.readAsDataURL(file);
}

function startDraw(e) {
    isDrawing=true;
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*canvas.width/rect.width;
    const y=(e.clientY-rect.top)*canvas.height/rect.height;
    
    if(currentTool==='erase') {
        ctx.globalCompositeOperation='destination-out';
        ctx.lineWidth=eraseSize;
        ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(x,y);
    } else if(currentTool==='brush') {
        ctx.globalCompositeOperation='source-over';
        ctx.strokeStyle='#00ff88';
        ctx.lineWidth=brushSize;
        ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(x,y);
    }
}

function draw(e) {
    if(!isDrawing) return;
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*canvas.width/rect.width;
    const y=(e.clientY-rect.top)*canvas.height/rect.height;
    
    if(currentTool==='erase' || currentTool==='brush') {
        ctx.lineTo(x,y);
        ctx.stroke();
    }
}

function stopDraw() {
    if(isDrawing && (currentTool==='erase' || currentTool==='brush')) {
        ctx.globalCompositeOperation='source-over';
    }
    isDrawing=false;
}

function addSticker(emoji) {
    const x=Math.random()*canvas.width*0.7;
    const y=Math.random()*canvas.height*0.7;
    ctx.font='48px Arial';
    ctx.textAlign='center';
    ctx.fillText(emoji,x,y);
    stickers.push({emoji,x,y});
}

function setStatus(msg) {
    document.getElementById('status').textContent=msg;
}

function downloadResult() {
    const link=document.createElement('a');
    link.download='lab-studio-v6.png';
    link.href=canvas.toDataURL();
    link.click();
}
</script>
</body>
                                           </html>
