<!DOCTYPE html>
<html>
<head>
<title>🔒 LAB STUDIO v6.2 - ERASER FIXED</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {font-family:'Courier New',monospace;background:#0a0a0a;color:#fff;padding:15px;}
.container {max-width:1100px;margin:0 auto;background:rgba(15,15,35,0.95);border-radius:15px;padding:25px;border:1px solid #00ff88;}
.logo {font-size:2em;background:linear-gradient(45deg,#00ff88,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:15px;}
.upload-zone {border:2px dashed #00ff88;border-radius:12px;padding:25px;text-align:center;cursor:pointer;transition:all 0.2s;margin:20px 0;background:rgba(0,255,136,0.05);}
.upload-zone:hover,.upload-zone.dragover {background:rgba(0,255,136,0.15);border-color:#00ff88;}
#fileInput{display:none;}
.upload-btn {background:linear-gradient(135deg,#00ff88,#00d4ff);color:#000;border:none;padding:12px 25px;border-radius:25px;font-weight:700;cursor:pointer;}
.tools-bar {display:flex;flex-wrap:wrap;gap:10px;margin:20px 0;background:rgba(255,255,255,0.05);padding:15px;border-radius:10px;}
.tool-btn {background:#333;padding:10px 15px;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:0.9em;transition:all 0.2s;}
.tool-btn.active {background:linear-gradient(135deg,#00ff88,#ff00ff);}
.tool-btn:hover {background:#00ff88;transform:translateY(-1px);}
.controls {display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin:20px 0;}
.control {background:rgba(255,255,255,0.05);padding:12px;border-radius:8px;}
.control label {display:block;margin-bottom:5px;color:#94a3b8;font-size:0.9em;}
.control input,.control select {width:100%;background:rgba(0,0,0,0.5);border:1px solid #00ff88;border-radius:5px;padding:8px;color:#fff;font-family:inherit;}
.canvas-container {display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0;}
canvas {border:2px solid #00ff88;border-radius:10px;max-width:100%;cursor:crosshair;background:#000;}
#originalCanvas {border-color:#666;}
.stickers {display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0;}
.sticker {width:45px;height:45px;border-radius:8px;background:#333;border:2px solid #666;cursor:pointer;font-size:1.5em;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.sticker:hover {border-color:#00ff88;transform:scale(1.1);}
#status {padding:12px;border-radius:8px;text-align:center;border:1px solid #00ff88;background:rgba(0,255,136,0.1);margin:15px 0;}
.download-btn {background:linear-gradient(135deg,#ff00ff,#00ff88);color:#000;border:none;padding:15px 30px;border-radius:25px;font-weight:700;cursor:pointer;font-size:1.1em;display:block;margin:15px auto;}
@media (max-width:768px) {.canvas-container,.tools-bar{grid-template-columns:1fr;flex-direction:column;}}
</style>
</head>
<body>
<div class="container">
    <div class="logo">🔒 LAB STUDIO v6.2 - ERASER ✅</div>
    
    <div class="upload-zone" id="uploadZone">
        <div style="font-size:2.5em;margin-bottom:10px;">🖼️</div>
        <div>Drag & drop image or click</div>
        <label for="fileInput" class="upload-btn">UPLOAD IMAGE</label>
        <input type="file" id="fileInput" accept="image/*">
    </div>
    
    <div class="tools-bar">
        <button class="tool-btn active" onclick="selectTool('select',this)">👆 Select</button>
        <button class="tool-btn" onclick="selectTool('erase',this)">🧽 ERASE</button>
        <button class="tool-btn" onclick="selectTool('brush',this)">✏️ BRUSH</button>
        <button class="tool-btn" onclick="selectTool('sticker',this)">🎨 STICKER</button>
    </div>
    
    <div class="canvas-container">
        <div>
            <div style="color:#666;text-align:center;margin-bottom:10px;">ORIGINAL</div>
            <canvas id="originalCanvas" width="400" height="300"></canvas>
        </div>
        <div>
            <div style="color:#00ff88;text-align:center;margin-bottom:10px;">YOUR EDITS → LIVE</div>
            <canvas id="editorCanvas" width="400" height="300"></canvas>
        </div>
    </div>
    
    <div class="controls">
        <div class="control"><label>Brightness</label><input type="range" id="brightness" min="0" max="200" value="100" oninput="applyFilters()"></div>
        <div class="control"><label>Filter</label><select id="filter" onchange="applyFilters()"><option value="none">None</option><option value="enhance">Enhance</option><option value="vintage">Vintage</option></select></div>
    </div>
    
    <div class="stickers" id="stickers" style="display:none;">
        <div class="sticker" onclick="addSticker('⭐')">⭐</div><div class="sticker" onclick="addSticker('❤️')">❤️</div>
        <div class="sticker" onclick="addSticker('🔥')">🔥</div><div class="sticker" onclick="addSticker('⚡')">⚡</div>
        <div class="sticker" onclick="addSticker('🎉')">🎉</div><div class="sticker" onclick="addSticker('👻')">👻</div>
    </div>
    
    <div id="status">Ready - Drag image to start editing</div>
    <button class="download-btn" onclick="downloadResult()" id="downloadBtn" style="display:none;">💾 DOWNLOAD EDITED IMAGE</button>
</div>

<script>
let canvas=document.getElementById('editorCanvas'), ctx=canvas.getContext('2d');
let originalCanvas=document.getElementById('originalCanvas'), originalCtx=originalCanvas.getContext('2d');
let originalImg, currentTool='select', isDrawing=false;

document.addEventListener('DOMContentLoaded',()=>{
    canvas.addEventListener('mousedown',startDraw);
    canvas.addEventListener('mousemove',draw);
    canvas.addEventListener('mouseup',stopDraw);
    canvas.addEventListener('mouseout',stopDraw);
    
    const zone=document.getElementById('uploadZone'), input=document.getElementById('fileInput');
    ['dragenter','dragover'].forEach(e=>zone.addEventListener(e,ev=> {ev.preventDefault();zone.classList.add('dragover');}));
    ['dragleave','drop'].forEach(e=>zone.addEventListener(e,ev=> {zone.classList.remove('dragover');ev.preventDefault();}));
    zone.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])input.files=e.dataTransfer.files;});
    input.addEventListener('change',e=>loadImage(e.target.files[0]));
});

function loadImage(file) {
    if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>{
        originalImg=new Image();
        originalImg.onload=()=>{
            // Show original
            originalCtx.drawImage(originalImg,0,0,400,300);
            // Copy to editor
            ctx.drawImage(originalImg,0,0,400,300);
            canvas.style.display='block';
            document.getElementById('downloadBtn').style.display='block';
            setStatus('✅ Image loaded! Try ERASE tool 🧽');
        };
        originalImg.src=e.target.result;
    };
    reader.readAsDataURL(file);
}

function selectTool(tool, btn) {
    currentTool=tool;
    document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('stickers').style.display=tool==='sticker'?'grid':'none';
    setStatus(`🛠️ Active: ${tool==='erase'?'🧽 ERASER':tool==='brush'?'✏️ BRUSH':tool.toUpperCase()}`);
}

function startDraw(e) {
    isDrawing=true;
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(canvas.width/rect.width);
    const y=(e.clientY-rect.top)*(canvas.height/rect.height);
    
    // 🧽 ERASER FIXED
    if(currentTool==='erase') {
        ctx.globalCompositeOperation='destination-out';
        ctx.lineWidth=25;
        ctx.lineCap='round';
        ctx.lineJoin='round';
        ctx.beginPath();
        ctx.moveTo(x,y);
    } 
    // ✏️ BRUSH
    else if(currentTool==='brush') {
        ctx.globalCompositeOperation='source-over';
        ctx.strokeStyle='#00ff88';
        ctx.lineWidth=15;
        ctx.lineCap='round';
        ctx.lineJoin='round';
        ctx.beginPath();
        ctx.moveTo(x,y);
    }
}

function draw(e) {
    if(!isDrawing) return;
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(canvas.width/rect.width);
    const y=(e.clientY-rect.top)*(canvas.height/rect.height);
    
    if(currentTool==='erase' || currentTool==='brush') {
        ctx.lineTo(x,y);
        ctx.stroke();
    }
}

function stopDraw() {
    // ✅ CRITICAL FIX: Always reset to normal drawing
    ctx.globalCompositeOperation='source-over';
    isDrawing=false;
}

function addSticker(emoji) {
    ctx.globalCompositeOperation='source-over';
    ctx.font='60px Arial';
    ctx.textAlign='center';
    ctx.fillStyle='#ff00ff';
    ctx.fillText(emoji,200,150);
    setStatus(`✅ Added ${emoji}`);
}

function applyFilters() {
    const bright=document.getElementById('brightness').value/100;
    const filter=document.getElementById('filter').value;
    
    // Redraw from original
    ctx.drawImage(originalCanvas,0,0);
    const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
    const data=imageData.data;
    
    for(let i=0;i<data.length;i+=4) {
        data[i]=Math.min(255,data[i]*bright);
        data[i+1]=Math.min(255,data[i+1]*bright);
        data[i+2]=Math.min(255,data[i+2]*bright);
        if(filter==='enhance') {
            data[i]=Math.min(255,data[i]*1.2);
            data[i+1]=Math.min(255,data[i+1]*1.2);
            data[i+2]=Math.min(255,data[i+2]*1.2);
        }
    }
    ctx.putImageData(imageData,0,0);
}

function setStatus(msg) {
    document.getElementById('status').textContent=msg;
}

function downloadResult() {
    const link=document.createElement('a');
    link.download='lab-studio-v6.2-edited.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    setStatus('💾 Downloaded!');
}
</script>
</body>
    </html>
