<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Head Swap – Browser Only</title>
  <style>
    body { font-family: Arial; text-align: center; background: #111; color: #eee; }
    canvas, video { max-width: 100%; margin: 10px; border: 2px solid #444; }
    button { padding: 12px 24px; margin: 8px; font-size: 1.1em; cursor: pointer; }
    #controls { margin: 20px; }
  </style>
</head>
<body>

<h2>Very Simple Browser Head Swap (not realistic – just demo)</h2>

<div>
  <label>Target photo (person whose head we keep):</label><br>
  <input type="file" id="targetInput" accept="image/*">
</div>

<div>
  <label>Swap head from this photo:</label><br>
  <input type="file" id="sourceInput" accept="image/*">
</div>

<div id="controls">
  <button onclick="doSwap()">Swap Heads</button>
  <button onclick="reset()">Reset</button>
</div>

<canvas id="output" width="800" height="600"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"></script>
<script>
// ────────────────────────────────────────────────
const { FaceLandmarker, FilesetResolver, DrawingUtils } = window.vision;

let faceLandmarker;
let targetImg = new Image();
let sourceImg = new Image();
const canvas = document.getElementById("output");
const ctx = canvas.getContext("2d");
const drawingUtils = new DrawingUtils(ctx);

async function init() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
      delegate: "GPU"   // try "CPU" if GPU fails
    },
    outputFaceBlendshapes: false,
    outputFacialTransformationMatrixes: false,
    runningMode: "IMAGE",
    numFaces: 1
  });

  console.log("MediaPipe Face Landmarker ready");
}

init();

// ────────────────────────────────────────────────
document.getElementById("targetInput").onchange = e => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = ev => { targetImg.src = ev.target.result; };
  reader.readAsDataURL(file);
};

document.getElementById("sourceInput").onchange = e => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = ev => { sourceImg.src = ev.target.result; };
  reader.readAsDataURL(file);
};

// ────────────────────────────────────────────────
async function detectLandmarks(img) {
  const mpImage = await createImageBitmap(await (await fetch(img.src)).blob());
  const results = await faceLandmarker.detect(mpImage);
  return results.faceLandmarks?.[0] || null;
}

function getHeadBox(landmarks) {
  if (!landmarks) return null;
  let minX = 1, maxX = 0, minY = 1, maxY = 0;
  // Use jaw + forehead landmarks roughly
  const indices = [10, 151, 9, 8, 168, 6, 197, 195, 5, 4, 1, 2, 0, 17, 18, 200, 199, 175];
  indices.forEach(i => {
    const lm = landmarks[i];
    if (lm) {
      minX = Math.min(minX, lm.x);
      maxX = Math.max(maxX, lm.x);
      minY = Math.min(minY, lm.y);
      maxY = Math.max(maxY, lm.y);
    }
  });
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

async function doSwap() {
  if (!targetImg.complete || !sourceImg.complete) {
    alert("Load both images first");
    return;
  }

  canvas.width = targetImg.width;
  canvas.height = targetImg.height;
  ctx.drawImage(targetImg, 0, 0);

  const targetLm = await detectLandmarks(targetImg);
  const sourceLm = await detectLandmarks(sourceImg);

  if (!targetLm || !sourceLm) {
    alert("Could not detect face in one or both photos");
    return;
  }

  const targetHead = getHeadBox(targetLm);
  const sourceHead = getHeadBox(sourceLm);

  if (!targetHead || !sourceHead) return;

  // Very naive affine transform – centers + scale only
  const sx = targetHead.w / sourceHead.w;
  const sy = targetHead.h / sourceHead.h;
  const scale = (sx + sy) / 2 * 1.1; // slight oversize

  const tx = targetHead.x + targetHead.w/2;
  const ty = targetHead.y + targetHead.h/2;

  const sxSrc = sourceHead.x + sourceHead.w/2;
  const sySrc = sourceHead.y + sourceHead.h/2;

  ctx.save();
  ctx.translate(tx * canvas.width, ty * canvas.height);
  ctx.scale(scale, scale);
  ctx.translate(-sxSrc * sourceImg.width, -sySrc * sourceImg.height);

  // Draw source head
  ctx.drawImage(sourceImg,
    (sourceHead.x - 0.1) * sourceImg.width,
    (sourceHead.y - 0.15) * sourceImg.height,
    sourceHead.w * 1.2 * sourceImg.width,
    sourceHead.h * 1.4 * sourceImg.height,
    0, 0,
    sourceHead.w * 1.2 * sourceImg.width,
    sourceHead.h * 1.4 * sourceImg.height
  );

  ctx.restore();

  // Very crude feathering attempt
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.arc(tx * canvas.width, ty * canvas.height, Math.min(targetHead.w, targetHead.h) * canvas.width * 0.45, 0, Math.PI*2);
  ctx.fill();

  ctx.globalCompositeOperation = "source-over";
  alert("Very basic head paste done (quality is low – this is browser limit)");
}

function reset() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
</script>
</body>
  </html>
