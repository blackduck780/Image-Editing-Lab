              <input type="email" placeholder="Email">
              <textarea placeholder="Message"></textarea>
              <button>Send</button>
            </form>
          </section>
        `;
      } else if (prompt.includes('landing') || prompt.includes('home')) {
        content = `
          <section class="hero">
            <h1>Welcome to ${prompt.charAt(0).toUpperCase() + prompt.slice(1)}</h1>
            <p>Explore the neon future.</p>
            <button>Learn More</button>
          </section>
        `;
      } else {
        content = `
          <section>
            <h2>${prompt.toUpperCase()}</h2>
            <p>Dynamic content based on your prompt: ${prompt}</p>
          </section>
        `;
      }

      return `
